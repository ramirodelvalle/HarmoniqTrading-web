<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35D0E2"/>
      <stop offset="100%" stop-color="#4A8BFF"/>
    </linearGradient>
  </defs>

  <!-- Atom orbits -->
  <ellipse cx="256" cy="256" rx="160" ry="115" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="256" cy="256" rx="115" ry="160" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" transform="rotate(90,256,256)"/>
  <ellipse cx="256" cy="256" rx="170" ry="90" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" transform="rotate(45,256,256)"/>
  <ellipse cx="256" cy="256" rx="170" ry="90" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" transform="rotate(-45,256,256)"/>

  <!-- Nucleus container -->
  <ellipse cx="256" cy="256" rx="72" ry="112" fill="white" fill-opacity="0" stroke="url(#g)" stroke-width="8"/>

  <!-- Candlestick -->
  <g fill="#7B61FF">
    <rect x="238" y="186" width="36" height="140" rx="6"/>
    <rect x="250" y="146" width="10" height="40" rx="5"/>
    <rect x="250" y="326" width="10" height="40" rx="5"/>
    <rect x="200" y="226" width="20" height="60" rx="5" opacity="0.9"/>
  </g>
